name: Ask a question
description: Is this normal? Does this count? What does this entry mean?
title: "[question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Questions are welcome and are not a lesser use of this tracker. "Is it normal that it asks before deleting?" is a perfectly good question, and the answer is sometimes more useful than an incident report.

        Asking does not log anything against your setup and does not create an entry in the catalogue.

  - type: textarea
    id: question
    attributes:
      label: What would you like to know?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything that would help answer it?
      description: Optional. What you are running, what you were doing, what you have already read.
    validations:
      required: false
